<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Nikhil Anand — Software Engineer | Applied AI/ML | Systems &amp; Open Source</title>
  <desc id="bannerDesc">Technical portfolio banner featuring dark navy architectural grid, neural node lattice, and systems telemetry schematic.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="45%" stop-color="#0d1527" />
      <stop offset="85%" stop-color="#0f1f38" />
      <stop offset="100%" stop-color="#091424" />
    </linearGradient>

    <!-- Accent Linear Gradients -->
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="blueViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="wireframeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#0f766e" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Engineering Grid Pattern -->
    <pattern id="engGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.06" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>

    <!-- Subtle Dot Grid -->
    <pattern id="dotSubGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.2" fill="#64748b" fill-opacity="0.12" />
    </pattern>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="300" rx="16" fill="url(#engGrid)" />
  <rect width="1200" height="300" rx="16" fill="url(#dotSubGrid)" />

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" stroke="#334155" stroke-opacity="0.45" stroke-width="1" />

  <!-- Ambient Glow Blobs -->
  <circle cx="1020" cy="140" r="170" fill="url(#cyanGlow)" filter="url(#softBlur)" />
  <circle cx="830" cy="210" r="140" fill="url(#tealGlow)" filter="url(#softBlur)" />

  <!-- Geometric Engineering Backdrop Lines -->
  <g opacity="0.35">
    <line x1="720" y1="0" x2="720" y2="300" stroke="#334155" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#1e293b" stroke-width="1" />
    <line x1="80" y1="52" x2="1120" y2="52" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- RIGHT SIDE: Neural Lattice / Distributed Systems Topology Graphic -->
  <g id="topologyGraphic" transform="translate(710, 20)">
    <!-- Circuit bus lines -->
    <path d="M 40 180 L 110 180 L 150 140 L 220 140 L 260 90 L 340 90 L 380 130 L 440 130" 
          fill="none" stroke="url(#wireframeGrad)" stroke-width="2" stroke-linecap="round" />
    
    <path d="M 70 220 L 130 220 L 180 170 L 250 170 L 290 220 L 390 220 L 430 180" 
          fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="3 3" />

    <path d="M 120 70 L 180 70 L 220 110 L 290 110 L 330 60 L 410 60" 
          fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Vertical interconnects -->
    <line x1="150" y1="140" x2="150" y2="200" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="260" y1="90" x2="260" y2="160" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="340" y1="90" x2="340" y2="190" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4" />

    <!-- Telemetry Console Box -->
    <g transform="translate(240, 75)" opacity="0.92">
      <rect x="0" y="0" width="195" height="125" rx="10" fill="#09101d" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
      <!-- Window header -->
      <line x1="0" y1="24" x2="195" y2="24" stroke="#1e293b" stroke-width="1" />
      <circle cx="14" cy="12" r="3.5" fill="#f43f5e" fill-opacity="0.8" />
      <circle cx="26" cy="12" r="3.5" fill="#eab308" fill-opacity="0.8" />
      <circle cx="38" cy="12" r="3.5" fill="#10b981" fill-opacity="0.8" />
      <text x="60" y="15" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500">pipeline.telemetry</text>
      
      <!-- Code / Metrics inside box -->
      <g transform="translate(14, 38)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5">
        <text x="0" y="10" fill="#94a3b8">
          <tspan fill="#38bdf8">model</tspan>.<tspan fill="#e2e8f0">forward</tspan>(x_t)
        </text>
        <text x="0" y="26" fill="#94a3b8">
          <tspan fill="#818cf8">grad_cam</tspan> = <tspan fill="#2dd4bf">1D_XAI</tspan>()
        </text>
        <text x="0" y="42" fill="#94a3b8">
          <tspan fill="#64748b">state:</tspan> <tspan fill="#34d399">VERIFIED_30_INV</tspan>
        </text>
        <!-- Mini sparkline -->
        <path d="M 0 65 L 25 58 L 50 62 L 75 50 L 100 54 L 125 45 L 150 48 L 165 40" 
              fill="none" stroke="url(#cyanTeal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="165" cy="40" r="2.5" fill="#38bdf8" />
      </g>
    </g>

    <!-- Node Vertices (Distributed Topology) -->
    <g fill="#0b1322" stroke-width="2">
      <!-- Vertex 1 -->
      <circle cx="40" cy="180" r="7" stroke="#38bdf8" />
      <circle cx="40" cy="180" r="2.5" fill="#38bdf8" />

      <!-- Vertex 2 -->
      <circle cx="110" cy="180" r="5" stroke="#2dd4bf" stroke-opacity="0.7" />
      <circle cx="110" cy="180" r="2" fill="#2dd4bf" />

      <!-- Vertex 3 -->
      <circle cx="150" cy="140" r="8" stroke="#38bdf8" />
      <circle cx="150" cy="140" r="3" fill="#38bdf8" />

      <!-- Vertex 4 -->
      <circle cx="220" cy="140" r="6" stroke="#818cf8" />
      <circle cx="220" cy="140" r="2" fill="#818cf8" />

      <!-- Vertex 5 -->
      <circle cx="260" cy="90" r="5" stroke="#2dd4bf" />
      
      <!-- Vertex 6 -->
      <circle cx="340" cy="90" r="6" stroke="#38bdf8" />
      <circle cx="340" cy="90" r="2.5" fill="#38bdf8" />

      <!-- Vertex 7 (Upper Right) -->
      <circle cx="410" cy="60" r="7" stroke="#818cf8" />
      <circle cx="410" cy="60" r="2.5" fill="#818cf8" />

      <!-- Vertex 8 (Lower Interconnect) -->
      <circle cx="180" cy="170" r="5" stroke="#38bdf8" stroke-opacity="0.6" />
      <circle cx="290" cy="220" r="6" stroke="#2dd4bf" stroke-opacity="0.8" />
      <circle cx="290" cy="220" r="2" fill="#2dd4bf" />
      <circle cx="390" cy="220" r="7" stroke="#38bdf8" />
      <circle cx="390" cy="220" r="3" fill="#38bdf8" />
      <circle cx="430" cy="180" r="5" stroke="#818cf8" stroke-opacity="0.6" />
    </g>

    <!-- Pulse Rings -->
    <circle cx="150" cy="140" r="14" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="390" cy="220" r="13" fill="none" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- LEFT SIDE: Identity, Track Record & Systems Focus -->
  <g transform="translate(75, 0)">
    <!-- Top Pill / Status Tag -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="310" height="26" rx="13" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#2dd4bf">
        <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SYSTEMS · APPLIED AI · OPEN SOURCE</text>
    </g>

    <!-- Developer Name -->
    <text x="0" y="132" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">
      Nikhil Anand
    </text>

    <!-- Professional Identity Subheading -->
    <text x="0" y="168" fill="url(#cyanTeal)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="18.5" font-weight="600" letter-spacing="-0.2">
      Software Engineer &#160;|&#160; Applied AI/ML &#160;|&#160; Systems &amp; Open Source
    </text>

    <!-- Core Value Statement -->
    <text x="0" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Engineering dependable ML workflows, distributed backend services, and verified developer tools.
    </text>

    <!-- Meta Highlights Badges / Indicators -->
    <g transform="translate(0, 226)" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5">
      <!-- Tag 1: Open Source Contribution -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="24" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#cbd5e1"><tspan fill="#38bdf8">PR</tspan> aboutcode-org #55</text>
      </g>

      <!-- Tag 2: Deep Learning & XAI -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="138" height="24" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#cbd5e1"><tspan fill="#2dd4bf">XAI</tspan> Closed-Loop ML</text>
      </g>

      <!-- Tag 3: Distributed Systems -->
      <g transform="translate(326, 0)">
        <rect x="0" y="0" width="156" height="24" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="16" fill="#cbd5e1"><tspan fill="#818cf8">Async</tspan> Microservices</text>
      </g>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="75" y="284" width="280" height="3" rx="1.5" fill="url(#cyanTeal)" />
</svg>
